name: Add AI models
# Adds models to the ai-models pre-release (the app build bundles everything in it).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-models.yml'
      - '.github/add_models.txt'
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p add
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            curl -fL --retry 4 --retry-delay 5 -o "add/$name" "$url"
          done < .github/add_models.txt
          ls -la add
          # They must open on the ONNX Runtime version the app ships (1.19.2).
          python3 -m pip install --quiet onnxruntime==1.19.2 numpy
          for f in add/*.onnx; do python3 -c "import onnxruntime as o, sys; s = o.InferenceSession(sys.argv[1]); print(sys.argv[1], 'opens on', o.__version__, [i.name for i in s.get_inputs()])" "$f"; done
          gh release upload ai-models add/* --clobber
