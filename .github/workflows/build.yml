name: Build Galeria APK

on:
  push:
    branches: [ main ]
    # Model tooling doesn't change the app: don't rebuild for it.
    paths-ignore:
      - '.github/workflows/fetch-models.yml'
      - '.github/workflows/export-lama.yml'
      - '.github/export_lama.py'
      - '.github/models.txt'
      - '.github/workflows/add-models.yml'
      - '.github/add_models.txt'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
               -o gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Bundle the on-device AI models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/models
          gh release download ai-models -p '*.onnx' -p '*.json' -D app/src/main/assets/models --clobber || echo "models not available: Clean Up falls back to the classic fill"
          ls -la app/src/main/assets/models

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILURE|What went wrong' -A3 build.log | head -200 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: galeria-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish APK as a release of its own version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # Each version gets its own release and is never replaced, so a download in progress is never cut off.
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER already exists; keeping it untouched."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk Photos.apk
          cp Photos.apk "Photos-$VER.apk"
          gh release create "v$VER" Photos.apk "Photos-$VER.apk" --title "Photos $VER" --notes "Version $VER, built from ${GITHUB_SHA::7}" --latest

      - name: Report APK size
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "## ✅ Build successful" >> $GITHUB_STEP_SUMMARY
            echo "APK size: **$SIZE**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          fi

  smoke-test:
    # Installs the new APK on a virtual phone, installs it again over itself as an update, opens it and taps around.
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Build the same app for the virtual phone's chip (x86_64)
        run: |
          ./gradlew assembleRelease -Pabi=x86_64 --no-daemon -q
          mkdir -p apk && cp app/build/outputs/apk/release/app-release.apk apk/app-release.apk
      - name: Make test photos
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          mkdir -p testphotos
          for i in $(seq 1 40); do
            convert -size 1200x900 "gradient:#$(openssl rand -hex 3)-#$(openssl rand -hex 3)" -fill white -pointsize 90 -gravity center -annotate 0 "Photo $i" "testphotos/IMG_$i.jpg"
          done
          ls testphotos | wc -l
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, update and run on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/smoke.sh
      - name: Upload screenshots for review
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls shots 2>/dev/null | wc -l
          if ls shots/*.png >/dev/null 2>&1; then
            gh release delete qa-shots --yes --cleanup-tag || true
            gh release create qa-shots shots/*.png --draft --title "QA screenshots" --notes "Screens from the automatic test, built from ${GITHUB_SHA::7}"
          fi
      - name: Results
        if: always()
        run: |
          cat smoke-result.txt 2>/dev/null || echo "no result file"
          cat smoke-result.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          grep -q "RESULT: PASS" smoke-result.txt

  stress-test:
    # 20,000 photos on a virtual phone: start-up time, scrolling, screens and memory.
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Build for the virtual phone's chip (x86_64)
        run: |
          ./gradlew assembleRelease -Pabi=x86_64 --no-daemon -q
          mkdir -p apk && cp app/build/outputs/apk/release/app-release.apk apk/app-release.apk
      - name: Make 20,000 test photos
        run: |
          python3 -m pip install --quiet pillow
          python3 .github/make_photos.py 20000 Camera
          du -sh Camera
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run with 20,000 photos
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disk-size: 8G
          disable-animations: false
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/stress.sh
      - name: Upload stress screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls stress_shots/*.png >/dev/null 2>&1; then
            gh release delete stress-shots --yes --cleanup-tag || true
            gh release create stress-shots stress_shots/*.png stress-result.txt --draft --title "Stress test" --notes "20,000 photos, built from ${GITHUB_SHA::7}"
          fi
      - name: Results
        if: always()
        run: |
          cat stress-result.txt 2>/dev/null || echo "no result file"
          cat stress-result.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

  cleanup-test:
    # Clean Up end to end on a virtual phone: real photo, circle the spoon, LaMa removes it.
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Bundle models and build for x86_64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/models
          gh release download ai-models -p '*.onnx' -p '*.json' -D app/src/main/assets/models --clobber
          ./gradlew assembleRelease -Pabi=x86_64 --no-daemon -q
          mkdir -p apk && cp app/build/outputs/apk/release/app-release.apk apk/app-release.apk
          ls -la apk
      - name: Test photo
        run: |
          python3 -m pip install --quiet scikit-image pillow numpy
          python3 -c "from skimage import data; from PIL import Image; Image.fromarray(data.coffee()).save('coffee.jpg', quality=95)"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Clean Up on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 6144M
          disk-size: 6G
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/cleanup_test.sh
      - name: Upload screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat cleanup-result.txt 2>/dev/null || true
          if ls cleanup_shots/*.png >/dev/null 2>&1; then
            gh release delete cleanup-shots --yes --cleanup-tag || true
            gh release create cleanup-shots cleanup_shots/*.png cleanup-result.txt --draft --title "Clean Up test" --notes "Built from ${GITHUB_SHA::7}"

  spatial-test:
    # Spatial Scenes on a virtual Android 13 phone (the 3D drawing needs its GPU shaders).
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Bundle models and build for x86_64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/models
          gh release download ai-models -p '*.onnx' -p '*.json' -D app/src/main/assets/models --clobber
          ./gradlew assembleRelease -Pabi=x86_64 --no-daemon -q
          mkdir -p apk && cp app/build/outputs/apk/release/app-release.apk apk/app-release.apk
          ls -la apk
      - name: Test photo
        run: |
          python3 -m pip install --quiet scikit-image pillow numpy
          python3 -c "from skimage import data; from PIL import Image; [Image.fromarray(getattr(data, n)()).convert('RGB').save(n + '.jpg', quality=95) for n in ('coffee', 'astronaut', 'brick')]"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Spatial Scenes on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 6144M
          disk-size: 6G
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/spatial_test.sh
      - name: Upload screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat spatial-result.txt 2>/dev/null || true
          if ls spatial_shots/*.png >/dev/null 2>&1; then
            gh release delete spatial-shots --yes --cleanup-tag || true
            gh release create spatial-shots spatial_shots/*.png spatial-result.txt --draft --title "Spatial test" --notes "Built from ${GITHUB_SHA::7}"
          fi
