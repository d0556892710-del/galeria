name: Build Galeria APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
               -o gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILURE|What went wrong' -A3 build.log | head -200 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: galeria-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish APK to the "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Photos.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Photos.apk --title "Photos (latest build)" --notes "Built from ${GITHUB_SHA::7}" --latest

      - name: Report APK size
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "## ✅ Build successful" >> $GITHUB_STEP_SUMMARY
            echo "APK size: **$SIZE**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          fi
