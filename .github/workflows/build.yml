name: Build Galeria APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -L "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
               -o gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build release APK
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e: |error:|FAILURE|What went wrong' -A3 build.log | head -200 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: galeria-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish APK as a release of its own version
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          # Each version gets its own release and is never replaced, so a download in progress is never cut off.
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER already exists; keeping it untouched."
            exit 0
          fi
          cp app/build/outputs/apk/release/app-release.apk Photos.apk
          cp Photos.apk "Photos-$VER.apk"
          gh release create "v$VER" Photos.apk "Photos-$VER.apk" --title "Photos $VER" --notes "Version $VER, built from ${GITHUB_SHA::7}" --latest

      - name: Report APK size
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ -f "$APK" ]; then
            SIZE=$(du -sh "$APK" | cut -f1)
            echo "## ✅ Build successful" >> $GITHUB_STEP_SUMMARY
            echo "APK size: **$SIZE**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Download the APK from the **Artifacts** section above." >> $GITHUB_STEP_SUMMARY
          fi

  smoke-test:
    # Installs the new APK on a virtual phone, installs it again over itself as an update, opens it and taps around.
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: galeria-apk
          path: apk
      - name: Make test photos
        run: |
          command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
          mkdir -p testphotos
          for i in $(seq 1 40); do
            convert -size 1200x900 "gradient:#$(openssl rand -hex 3)-#$(openssl rand -hex 3)" -fill white -pointsize 90 -gravity center -annotate 0 "Photo $i" "testphotos/IMG_$i.jpg"
          done
          ls testphotos | wc -l
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, update and run on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/smoke.sh
      - name: Results
        if: always()
        run: |
          cat smoke-result.txt 2>/dev/null || echo "no result file"
          cat smoke-result.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          grep -q "RESULT: PASS" smoke-result.txt
