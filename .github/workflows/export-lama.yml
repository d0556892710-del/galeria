name: Export LaMa (high resolution)
# Exports big-lama to ONNX at fixed 768 and 1024 px (the public ONNX is 512 only), checks it against PyTorch.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/export-lama.yml'
      - '.github/export_lama.py'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python3 -m pip install --quiet torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --quiet onnx==1.16.2 onnxruntime==1.19.2 numpy==1.26.4
      - name: Download big-lama
        run: |
          curl -fL --retry 4 -o big-lama.pt https://github.com/Sanster/models/releases/download/add_big_lama/big-lama.pt
          ls -la big-lama.pt
      - name: Export
        run: python3 .github/export_lama.py 512 1024
      - name: Publish (public pre-release the app build downloads from; LaMa is Apache-2.0)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la lama_*.onnx
          sha256sum lama_*.onnx | tee SHA256SUMS.txt
          gh release delete ai-models --yes --cleanup-tag || true
          gh release create ai-models lama_512.onnx lama_1024.onnx SHA256SUMS.txt --prerelease --title "On-device AI models" --notes "LaMa (big-lama, Apache-2.0, by Samsung AI Center / advimman) exported to ONNX at 512 and 1024 px for Clean Up."
