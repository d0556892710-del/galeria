name: Fetch AI models
# Downloads the on-device AI models into a private draft release, for evaluation and for the app build.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-models.yml'
      - '.github/models.txt'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download models
        run: |
          mkdir -p models
          while read -r name url; do
            [ -z "$name" ] && continue
            case "$name" in \#*) continue;; esac
            echo "== $name"
            curl -fL --retry 4 --retry-delay 5 -o "models/$name" "$url" || echo "FAILED $name"
          done < .github/models.txt
          # Unpack zipped models: models/<zip name>__<file>.onnx
          for z in models/*.zip; do
            [ -e "$z" ] || continue
            base=$(basename "$z" .zip); mkdir -p "tmp_$base"; unzip -o -q "$z" -d "tmp_$base"
            find "tmp_$base" -name '*.onnx' -o -name '*.json' -o -name '*.yaml' | while read f; do cp "$f" "models/${base}__$(basename "$f")"; done
            find "tmp_$base" -type f | head -20
            rm "$z"
          done
          ls -la models
          sha256sum models/* > models/SHA256SUMS.txt
          cat models/SHA256SUMS.txt
      - name: Inspect ONNX models
        run: |
          python3 -m pip install --quiet onnxruntime numpy
          for f in models/*.json; do echo "== $f"; head -c 1500 "$f"; echo; done
          python3 - <<'PY'
          import glob, time, numpy as np, onnxruntime as ort
          for f in sorted(glob.glob("models/*.onnx")):
              try:
                  s = ort.InferenceSession(f, providers=["CPUExecutionProvider"])
                  ins = s.get_inputs()
                  print(f, "IN", [(i.name, i.shape, i.type) for i in ins], "OUT", [(o.name, o.shape, o.type) for o in s.get_outputs()], flush=True)
                  # Rough speed on this CPU (4 cores), with free sizes set to 518 (or the fixed size).
                  if len(ins) == 1 and "float" in ins[0].type:
                      for side in ([518, 770] if not isinstance(ins[0].shape[2], int) else [ins[0].shape[2]]):
                          shp = [1, 3, side, side]
                          x = np.random.rand(*shp).astype(np.float32)
                          s.run(None, {ins[0].name: x}); t = time.time(); out = s.run(None, {ins[0].name: x})
                          print("   run", shp, f"{(time.time()-t)*1000:.0f} ms", [o.shape for o in out], "range", float(out[0].min()), float(out[0].max()), flush=True)
              except Exception as e:
                  print(f, "ERROR", e)
          PY
      - name: Publish to a private draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete models --yes --cleanup-tag || true
          gh release create models models/* --draft --title "AI models" --notes "On-device models (downloaded by CI)."
